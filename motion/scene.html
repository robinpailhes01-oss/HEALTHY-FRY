<!doctype html>
<html><head><meta charset="utf-8">
<!-- Healthy Fry — moteur de motion design générique.
     Python injecte une timeline (window.setup(T)), puis appelle window.render(t) pour chaque image.
     Tout est déterministe : une même timeline donne toujours la même vidéo. -->
<style>
@font-face { font-family: P; font-weight: 600; src: url(../montage/fonts/Poppins-600.ttf); }
@font-face { font-family: P; font-weight: 800; src: url(../montage/fonts/Poppins-800.ttf); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; font-family: P, 'Noto Color Emoji', sans-serif; }
#bg, #stage { position: absolute; inset: 0; }
#stage { transform-origin: 50% 45%; }
.el { position: absolute; left: 0; top: 0; visibility: hidden; transform-origin: 50% 50%; }
img.el { filter: drop-shadow(0 38px 34px rgba(60,40,20,.33)) drop-shadow(0 8px 10px rgba(60,40,20,.22)); }
.txt { font-weight: 800; color: #2E5E3A; white-space: nowrap; letter-spacing: -2px; line-height: 1.05; text-align: center; }
.pill { background: #2E5E3A; color: #fff; font-weight: 800; border-radius: 999px; white-space: nowrap; padding: 12px 32px; font-size: 40px; box-shadow: 0 12px 30px rgba(0,0,0,.18); }
.pill.light { background: #F4EFE4; color: #2E5E3A; border: 5px solid #2E5E3A; }
.stamp { background: #F4EFE4; color: #2E5E3A; border: 7px solid #2E5E3A; font-weight: 800; border-radius: 28px; padding: 12px 34px; font-size: 54px; white-space: nowrap; box-shadow: 0 16px 40px rgba(0,0,0,.25); }
.card { background: #F4EFE4; border-radius: 44px; box-shadow: 0 24px 60px rgba(0,0,0,.22); text-align: center; white-space: normal; }
.stat { width: 310px; height: 340px; border-radius: 44px; background: #F4EFE4; box-shadow: 0 20px 50px rgba(0,0,0,.18); display: flex; flex-direction: column; align-items: center; justify-content: center; border: 6px solid #2E5E3A; }
.stat b { font-size: 150px; font-weight: 800; color: #2E5E3A; line-height: 1; letter-spacing: -4px; }
.stat span { font-size: 34px; font-weight: 800; color: #6BAF6E; margin-top: 8px; }
.bignum { font-weight: 800; font-size: 900px; color: rgba(46,94,58,.07); line-height: 1; }
#fx, #grain { position: absolute; inset: 0; pointer-events: none; }
#grain { opacity: .07; mix-blend-mode: multiply; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
#bar { position: absolute; left: 0; top: 0; height: 12px; background: #6BAF6E; }
svg { position: absolute; left: 0; top: 0; overflow: visible; }
</style></head>
<body>
<div id="bg"></div>
<div id="stage"></div>
<canvas id="fx" width="1080" height="1920"></canvas>
<svg id="svg" width="1080" height="1920"></svg>
<div id="flash"></div>
<div id="bar"></div>
<canvas id="grain" width="540" height="960"></canvas>

<script>
// ------------------------------------------------------------------ utilitaires
const $ = (id) => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, d) => cl((t - a) / d);
const lerp = (a, b, p) => a + (b - a) * p;
const oC = (p) => 1 - Math.pow(1 - p, 3);
const iC = (p) => p * p * p;
const oB = (p) => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const ioS = (p) => -(Math.cos(Math.PI * p) - 1) / 2;
function rnd(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const NS = 'http://www.w3.org/2000/svg';
let T, E = {}, shown = new Set(), ratio = {};

function mk(id, html, cls, style = '') {             // crée un élément texte dans la scène
  const d = document.createElement('div'); d.id = id; d.className = 'el ' + cls; d.style.cssText = style; d.innerHTML = html;
  $('stage').appendChild(d); E[id] = d; return d;
}
function mkImg(id, asset) {
  const i = document.createElement('img'); i.id = id; i.className = 'el'; i.src = T.assets[asset];
  i.dataset.asset = asset; $('stage').appendChild(i); E[id] = i; return i;
}
// place un élément centré en (cx, cy) ; pour une image, w = largeur en pixels
function put(id, cx, cy, { s = 1, r = 0, o = 1, w = null } = {}) {
  const e = E[id]; if (!e) return;
  if (o <= 0.001 || s <= 0.001 || (w !== null && w <= 1)) return;
  let ew, eh;
  if (w !== null) { ew = w; eh = w * ratio[e.dataset.asset]; e.style.width = w + 'px'; }
  else { ew = e.offsetWidth; eh = e.offsetHeight; }
  e.style.transform = `translate(${cx - ew / 2}px, ${cy - eh / 2}px) rotate(${r}deg) scale(${s})`;
  e.style.opacity = o; e.style.visibility = 'visible'; shown.add(id);
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

// ------------------------------------------------------------------ particules
let crumbs = [], steam = [];
function burst(ctx, t0, t, cx, cy, couleurs, force = 1) {
  const dt = t - t0; if (dt < 0 || dt > 1.3) return;
  crumbs.forEach((p, k) => {
    const x = cx + Math.cos(p.a) * p.v * dt * force, y = cy + Math.sin(p.a) * p.v * dt * .8 * force + 900 * dt * dt;
    ctx.globalAlpha = cl(1 - dt / 1.3); ctx.fillStyle = couleurs[k % couleurs.length];
    ctx.save(); ctx.translate(x, y); ctx.rotate(p.spin * 10 * dt); ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .8); ctx.restore();
  });
  ctx.globalAlpha = 1;
}
function vapeur(ctx, t, cx, cy, largeur, force) {
  if (force <= 0) return;
  for (const s of steam) {
    const ph = (t * .45 + s.d) % 1, x = cx + (s.x - .5) * largeur + Math.sin((t + s.w * 6) * 2) * 30 * ph, y = cy - ph * 520;
    const g = ctx.createRadialGradient(x, y, 0, x, y, s.s * (1 + ph));
    g.addColorStop(0, `rgba(255,255,255,${.4 * force * Math.sin(ph * Math.PI)})`); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, s.s * (1 + ph), 0, 7); ctx.fill();
  }
}
function sparkles(ctx, t, t0, cx, cy, n = 10, rayon = 380) {
  const dt = t - t0; if (dt < 0 || dt > 1.6) return;
  for (let k = 0; k < n; k++) {
    const a = k / n * Math.PI * 2 + 0.3, d = rayon * oC(cl(dt / .8)), x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d * .8;
    const s = 22 * Math.sin(Math.PI * cl(dt / 1.6)); ctx.fillStyle = '#FFFFFF'; ctx.globalAlpha = .9;
    ctx.beginPath(); for (let i = 0; i < 8; i++) { const r = i % 2 ? s * .25 : s; const b = i / 8 * Math.PI * 2; ctx.lineTo(x + Math.cos(b) * r, y + Math.sin(b) * r); }
    ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
  }
}

// ------------------------------------------------------------------ construction
window.setup = async (timeline) => {
  T = timeline;
  for (const [k, src] of Object.entries(T.assets)) { const im = new Image(); im.src = src; await im.decode(); ratio[k] = im.naturalHeight / im.naturalWidth; }
  T.scenes.forEach((S, i) => {
    const p = `s${i}_`;
    if (S.type === 'hook') {
      (S.lignes || []).forEach((l, k) => mk(p + 'w' + k, k === S.lignes.length - 1 ? `<span style="display:inline-block;background:#2E5E3A;color:#F4EFE4;padding:0 34px 8px;border-radius:26px">${esc(l)}</span>` : esc(l), 'txt', `font-size:${k === S.lignes.length - 1 ? 124 : 112}px`));
      if (S.badge) mk(p + 'badge', esc(S.badge), 'stamp');
      mkImg(p + 'hero', S.hero || 'hero');
    }
    if (S.type === 'promesse') {
      mk(p + 'titre', esc(S.titre || ''), 'txt', 'font-size:78px');
      (S.stats || []).forEach((st, k) => mk(p + 'st' + k, `<b>${esc(st[0])}</b><span>${esc(st[1])}</span>`, 'stat'));
      mkImg(p + 'hero', S.hero || 'hero');
    }
    if (S.type === 'ingredients') {
      mk(p + 'titre', esc(S.titre || 'LES INGRÉDIENTS'), 'pill', 'font-size:46px');
      S.items.forEach((it, k) => { mkImg(p + 'i' + k, it.img); mk(p + 'l' + k, esc(it.label), 'pill light', 'font-size:36px'); });
    }
    if (S.type === 'etape') {
      mk(p + 'num', String(S.num), 'bignum');
      mk(p + 'tag', `ÉTAPE ${S.num}/${S.total}`, 'pill', 'font-size:40px');
      const mots = String(S.texte).split(' ');
      mk(p + 'texte', mots.map((m, k) => `<span id="${p}m${k}" style="display:inline-block;margin:0 10px">${esc(m)}</span>`).join(''), 'txt', 'font-size:84px;white-space:normal;width:960px');
      (S.items || []).forEach((it, k) => mkImg(p + 'i' + k, it));
      if (S.resultat) mkImg(p + 'res', S.resultat);
    }
    if (S.type === 'cuisson') {
      mk(p + 'temp', `${S.temp}°C`, 'txt', 'font-size:150px;letter-spacing:-4px');
      mk(p + 'clock', `${S.minutes}:00`, 'pill', 'font-size:64px');
      mkImg(p + 'af', 'airfryer');
      if (S.dans) mkImg(p + 'dans', S.dans);
      const c = document.createElementNS(NS, 'circle'); c.id = p + 'ring';
      ['cx', 540, 'cy', 960, 'r', 430, 'fill', 'none', 'stroke', '#6BAF6E', 'stroke-width', 18, 'stroke-linecap', 'round', 'transform', 'rotate(-90 540 960)'].reduce((a, v, k, arr) => { if (k % 2 === 0) c.setAttribute(v, arr[k + 1]); return a; }, 0);
      $('svg').appendChild(c); E[p + 'ring'] = c;
    }
    if (S.type === 'resultat') {
      mkImg(p + 'hero', S.hero || 'hero');
      (S.labels || []).forEach((l, k) => {
        mk(p + 'lab' + k, esc(l), 'pill', 'font-size:42px');
        const path = document.createElementNS(NS, 'path'); path.id = p + 'ar' + k;
        path.setAttribute('d', k ? 'M760 1250 C 760 1150, 650 1080, 560 1000' : 'M300 640 C 300 720, 250 760, 215 800');
        ['fill', 'none', 'stroke', '#2E5E3A', 'stroke-width', 9, 'stroke-linecap', 'round'].reduce((a, v, j, arr) => { if (j % 2 === 0) path.setAttribute(v, arr[j + 1]); return a; }, 0);
        $('svg').appendChild(path); E[path.id] = path;
      });
    }
    if (S.type === 'astuce') {
      mk(p + 'tag', '💡 ASTUCE', 'pill', 'font-size:48px');
      mk(p + 'card', `<div style="font-size:58px;font-weight:800;color:#2E5E3A;line-height:1.2">${esc(S.texte)}</div>`, 'card', 'width:900px;padding:56px 50px');
      mkImg(p + 'hero', S.hero || 'hero');
    }
    if (S.type === 'cta') {
      mkImg(p + 'hero', S.hero || 'hero');
      mk(p + 'card', `<div style="font-size:72px;font-weight:800;color:#2E5E3A;line-height:1.1">${esc(S.titre || 'Enregistre la recette')}</div>
        <div style="font-size:40px;font-weight:600;color:#1F3A26;margin-top:18px">${esc(S.texte || 'Une recette Airfryer chaque jour 💚')}</div>
        <div class="pill" style="display:inline-block;margin-top:26px;font-size:46px">${esc(T.handle)}</div>`, 'card', 'width:900px;padding:52px 40px');
    }
  });
  const r = rnd(7);
  for (let i = 0; i < 70; i++) crumbs.push({ a: r() * Math.PI * 2, v: 500 + r() * 900, s: 5 + r() * 13, spin: r() });
  for (let i = 0; i < 26; i++) steam.push({ x: r(), d: r() * 3, s: 60 + r() * 90, w: r() });
  const g = $('grain').getContext('2d'), im = g.createImageData(540, 960);
  for (let i = 0; i < im.data.length; i += 4) { const v = 128 + (r() - .5) * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0);
  await document.fonts.ready;
};

// ------------------------------------------------------------------ scènes
const MIETTES = ['#5a3418', '#b98544', '#7a4a22'];
const R = {
  hook(S, p, t, a, b, fx) {
    const hv = T.hookVideo, out = iC(P(t, b - .35, .35));
    if (!hv) {
      const pin = oB(P(t, a, .75));
      put(p + 'hero', 540, lerp(1950, 930, pin), { w: 940 * (lerp(.35, 1, pin) + (t - a) * .035 + out * 1.8), r: lerp(-28, -4, pin), o: 1 - out });
      burst(fx, a + .55, t, 540, 930, MIETTES);
    }
    (S.lignes || []).forEach((l, k) => {
      const q = oB(P(t, a + .1 + k * .2, .45)), o = 1 - P(t, b - .3, .25);
      const e = E[p + 'w' + k]; e.style.color = hv ? '#fff' : '#2E5E3A'; e.style.textShadow = hv ? '0 6px 24px rgba(0,0,0,.55)' : 'none';
      put(p + 'w' + k, 540, 230 + k * 150, { s: lerp(2.2, 1, q), r: k === S.lignes.length - 1 ? -3 : 0, o: q > 0 ? cl(q * 2) * o : 0 });
    });
    const bq = oC(P(t, a + 1.1, .3)), bo = 1 - P(t, b - .3, .25);
    put(p + 'badge', 720, 1210, { s: lerp(2.4, 1, bq), r: -8, o: bq > 0 ? bq * bo : 0 });
  },
  promesse(S, p, t, a, b, fx) {
    const out = P(t, b - .3, .3), o = 1 - out;
    const q = oB(P(t, a, .45)); put(p + 'titre', 540, 380, { s: lerp(.5, 1, q), o: q * o });
    (S.stats || []).forEach((st, k) => {
      const ka = a + .35 + k * .45, z = oB(P(t, ka, .45));
      const x = [195, 540, 885][k] ?? 540, y = 700 + (k % 2) * 70;
      put(p + 'st' + k, x, y + Math.sin((t - ka) * 2 + k) * 8, { s: lerp(.2, 1, z), r: lerp(-20, (k - 1) * 4, z), o: z > 0 ? cl(z * 2) * o : 0 });
      const n = parseFloat(st[0]); if (!isNaN(n)) E[p + 'st' + k].querySelector('b').textContent = Math.round(n * oC(P(t, ka, .8)));
    });
    const h = oC(P(t, a + .2, .7));
    put(p + 'hero', 540, lerp(1700, 1180, h) + Math.sin(t * 1.5) * 10, { w: 760, r: lerp(20, -3, h) + Math.sin(t) * 2, o: h * o });
  },
  ingredients(S, p, t, a, b, fx) {
    const n = S.items.length, rows = Math.ceil(n / 2), top = 640, bot = 1180;
    const dy = rows > 1 ? (bot - top) / (rows - 1) : 0, w = rows >= 4 ? 230 : rows === 3 ? 290 : 360;
    const q = oB(P(t, a, .45)), out = ioS(P(t, b - .5, .5));
    put(p + 'titre', 540, 340, { s: q, o: q * (1 - P(t, b - .3, .3)) });
    S.items.forEach((it, k) => {
      const row = Math.floor(k / 2), seul = (k === n - 1 && n % 2 === 1);
      const x0 = seul ? 540 : (k % 2 ? 790 : 290), y0 = top + row * dy - 60;
      const ta = S.reveal[k], z = oB(P(t, ta, .55)), bob = Math.sin((t - ta) * 2.2 + k) * 8;
      const x = lerp(x0, 540, out), y = lerp(lerp(y0 - 700, y0, z) + bob, 950, out);
      put(p + 'i' + k, x, y, { w: w * lerp(.3, 1, z) * (1 - out), r: lerp(-35 + k * 15, k % 2 ? 6 : -6, z) + out * 360, o: t >= ta ? 1 : 0 });
      const lz = oB(P(t, ta + .2, .35));
      put(p + 'l' + k, x0, y0 + w * .42 + 22, { s: lz * .95, o: t >= ta + .2 ? lz * (1 - P(t, b - .5, .2)) : 0 });
    });
  },
  etape(S, p, t, a, b, fx) {
    const out = P(t, b - .3, .3), o = 1 - out;
    const nq = oC(P(t, a, .6)); put(p + 'num', 540, 980, { s: lerp(1.3, 1, nq), o: nq * o });
    const tq = oB(P(t, a, .4)); put(p + 'tag', 540, 300, { s: tq, o: tq * o });
    String(S.texte).split(' ').forEach((m, k) => {
      const e = $(p + 'm' + k), z = oB(P(t, a + .15 + k * .07, .35));
      e.style.transform = `translateY(${lerp(60, 0, z)}px) scale(${lerp(.6, 1, z)})`; e.style.opacity = cl(z * 1.5);
    });
    put(p + 'texte', 540, 470, { o });
    const items = S.items || [], n = items.length, choc = a + Math.min(1.3, (b - a) * .35);
    items.forEach((it, k) => {
      const ang = (k / Math.max(n, 1)) * Math.PI * 2 + Math.PI / 2;
      const sx = 540 + Math.cos(ang) * 700, sy = 1000 + Math.sin(ang) * 500;
      const vient = oC(P(t, a + .1 + k * .12, .6)), fusion = ioS(P(t, choc - .35, .35));
      const rayon = n > 1 ? lerp(280, 150, fusion) : 0, tour = fusion * (t - choc + .35) * 1.6;   // mélange : rotation autour du centre
      const ex = 540 + Math.cos(ang + tour) * rayon, ey = 1010 + Math.sin(ang + tour) * rayon * .75;
      const x = lerp(sx, ex, vient), y = lerp(sy, ey, vient);
      const disparait = S.resultat ? P(t, choc, .1) : 0;
      const base = n > 2 ? 360 : n === 1 ? 560 : 440;
      put(p + 'i' + k, x, y + Math.sin(t * 2 + k) * 10, { w: base * (1 + .06 * Math.sin((t - choc) * 6) * fusion) * (1 - disparait), r: (t - a) * (k % 2 ? 22 : -22), o: o * (1 - disparait) });
    });
    if (n) { burst(fx, choc, t, 540, 1010, S.couleurs || MIETTES, 1); T._flash = Math.max(T._flash, Math.max(0, 1 - P(t, choc, .15)) * (t >= choc ? .35 : 0)); }
    if (S.resultat) { const z = oB(P(t, choc, .5)); put(p + 'res', 540, 1000 + Math.sin(t * 1.6) * 10, { w: 620 * lerp(.2, 1, z), r: Math.sin(t) * 3, o: t >= choc ? o : 0 }); sparkles(fx, t, choc, 540, 1000); }
  },
  cuisson(S, p, t, a, b, fx) {
    const chaud = P(t, a + 1.4, .6) * (1 - P(t, b - .3, .3));
    T._chaud = chaud;
    if (S.dans) { const z = oB(P(t, a, .4)), into = ioS(P(t, a + .8, .45)); put(p + 'dans', 540, lerp(900, 1000, into), { w: 560 * z * lerp(1, .2, into), r: (t - a) * 30, o: into < 1 ? 1 : 0 }); }
    const af = oC(P(t, a + .5, .5)), ao = iC(P(t, b - .4, .4)), shake = Math.sin(t * 60) * 1.5 * chaud;
    E[p + 'af'].style.filter = `drop-shadow(0 40px 38px rgba(60,40,20,.35)) drop-shadow(0 0 ${60 * chaud}px rgba(255,140,40,${.75 * chaud}))`;
    put(p + 'af', lerp(1500, 540, af) + shake, 1000 + ao * 1400, { w: 640, o: ao < 1 ? 1 : 0 });
    vapeur(fx, t, 540, 640, 300, chaud);
    const tv = oC(P(t, a + 1.2, .35)) * (1 - P(t, b - .35, .3));
    const tp = P(t, a + 1.3, .7), tm = P(t, a + 1.9, b - a - 2.4);
    E[p + 'temp'].textContent = Math.round(lerp(20, S.temp, oC(tp))) + '°C';
    const sec = Math.round(S.minutes * 60 * (1 - tm)); E[p + 'clock'].textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
    put(p + 'temp', 540, 300, { s: lerp(.6, 1, tv), o: tv }); put(p + 'clock', 540, 430, { s: lerp(.6, 1, tv), o: tv });
    const ring = E[p + 'ring'], circ = 2 * Math.PI * 430; ring.style.strokeDasharray = circ; ring.style.strokeDashoffset = circ * (1 - tm); ring.style.opacity = tv * .9;
  },
  resultat(S, p, t, a, b, fx) {
    const z = oB(P(t, a, .7)), out = iC(P(t, b - .35, .35));
    put(p + 'hero', 540, 930 - out * 300, { w: 940 * (lerp(.15, 1.12, z) + (t - a) * .03) * (1 - out * .45), r: lerp(14, 2, z), o: 1 - out * .2 });
    vapeur(fx, t, 540, 820, 500, 1 - P(t, b - .4, .4));
    burst(fx, a + .05, t, 540, 930, MIETTES);
    sparkles(fx, t, a + .1, 540, 930, 12, 520);
    const fade = 1 - P(t, b - .35, .3);
    (S.labels || []).forEach((l, k) => {
      const la = a + .7 + k * .6, q = oB(P(t, la, .4));
      put(p + 'lab' + k, k ? 790 : 300, k ? 1300 : 590, { s: q, r: k ? 3 : -3, o: t > la ? q * fade : 0 });
      const ar = E[p + 'ar' + k], L = ar.getTotalLength(), d = oC(P(t, la + .1, .4));
      ar.style.strokeDasharray = L; ar.style.strokeDashoffset = L * (1 - d); ar.style.opacity = t > la ? fade : 0;
    });
    T._flash = Math.max(T._flash, Math.max(0, 1 - P(t, a, .25)) * .7);
  },
  astuce(S, p, t, a, b, fx) {
    const out = P(t, b - .3, .3), o = 1 - out;
    const q = oB(P(t, a, .45)); put(p + 'tag', 540, 420, { s: q, r: -3, o: q * o });
    const c = oB(P(t, a + .25, .5)); put(p + 'card', 540, 720, { s: lerp(.5, 1, c), o: c * o });
    const h = oC(P(t, a + .4, .7)); put(p + 'hero', 540, lerp(1800, 1250, h) + Math.sin(t * 1.6) * 12, { w: 640, r: Math.sin(t) * 4, o: h * o });
  },
  cta(S, p, t, a, b, fx) {
    const h = oC(P(t, a, .5)); put(p + 'hero', 540, lerp(930, 640, h), { w: 940 * lerp(1.12, .7, h), r: 2 });
    const c = oB(P(t, a + .2, .5)); put(p + 'card', 540, 1150, { s: lerp(.4, 1, c), o: t > a + .2 ? cl(c * 1.5) : 0 });
    sparkles(fx, t, a + .3, 540, 640, 10, 420);
  },
};

// ------------------------------------------------------------------ rendu d'une image
window.render = (t) => {
  shown.forEach((id) => { E[id].style.visibility = 'hidden'; }); shown.clear();
  for (const id in E) if (E[id].tagName === 'circle' || E[id].tagName === 'path') E[id].style.opacity = 0;
  const fx = $('fx').getContext('2d'); fx.clearRect(0, 0, 1080, 1920);
  T._chaud = 0; T._flash = 0;
  let idx = T.scenes.findIndex((S) => t >= S.a && t < S.b); if (idx < 0) idx = T.scenes.length - 1;
  const S = T.scenes[idx];
  R[S.type](S, `s${idx}_`, t, S.a, S.b, fx);
  // petit « coup de caméra » à chaque changement de scène
  const k = P(t, S.a, .35); $('stage').style.transform = `scale(${1 + .05 * (1 - oC(k))})`;
  // fond crème vivant (chaud pendant la cuisson), grain photo, barre de progression
  const hv = T.hookVideo && S.type === 'hook';
  const lx = 540 + Math.sin(t * .6) * 160, ly = 820 + Math.cos(t * .45) * 120, ch = T._chaud;
  $('bg').style.background = hv ? 'transparent' : `radial-gradient(circle at ${lx}px ${ly}px, ${ch > 0 ? `rgba(255,${220 - 60 * ch},${170 - 90 * ch},1)` : '#FFFBF2'} 0%, #F4EFE4 38%, #E6DCC8 100%)`;
  document.body.style.background = hv ? 'transparent' : '#F4EFE4';
  $('grain').style.visibility = hv ? 'hidden' : 'visible';
  $('grain').style.transform = `translate(${(t * 7919) % 30 - 15}px, ${(t * 104729) % 30 - 15}px) scale(2.05)`; $('grain').style.transformOrigin = '0 0';
  const trans = T.hookVideo && idx === 1 ? Math.max(0, 1 - P(t, S.a, .3)) * .9 : 0;   // flash vidéo → animation
  $('flash').style.opacity = Math.max(T._flash, trans);
  $('bar').style.width = (1080 * t / T.total) + 'px';
};
</script>
